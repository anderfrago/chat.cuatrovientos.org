<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente IA - Cuatrovientos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --cv-azul: #003366; /* Azul corporativo */
            --cv-rojo: #e4002b; /* Rojo acento */
            --cv-gris: #f4f4f4;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--cv-gris);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 500px;
            background: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Cabecera estilo Cuatrovientos */
        .chat-header {
            background-color: var(--cv-azul);
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom: 4px solid var(--cv-rojo);
        }

        .chat-header i {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .chat-header h2 {
            margin: 0;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Caja de mensajes */
        #chat-box {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            background-color: white;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            padding: 10px 15px;
            border-radius: 15px;
            max-width: 85%;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .user-msg {
            align-self: flex-end;
            background-color: var(--cv-azul);
            color: white;
            border-bottom-right-radius: 2px;
        }

        .ai-msg {
            align-self: flex-start;
            background-color: #e9ecef;
            color: #333;
            border-bottom-left-radius: 2px;
            border-left: 4px solid var(--cv-rojo);
        }

        /* Formulario de entrada */
        .input-area {
            display: flex;
            padding: 15px;
            background: #fff;
            border-top: 1px solid #eee;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            outline: none;
            transition: border 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--cv-azul);
        }

        button {
            background-color: var(--cv-rojo);
            color: white;
            border: none;
            padding: 0 20px;
            margin-left: 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #b30021;
        }

        button i {
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <i class="fas fa-graduation-cap"></i>
            <h2>Asistente Cuatrovientos</h2>
        </div>

        <div id="chat-box">
            <div class="message ai-msg">
                ¡Hola! Soy el asistente virtual. ¿En qué puedo ayudarte hoy?
            </div>
        </div>

        <form class="input-area" id="chat-form">
            <input type="text" id="user-input" placeholder="Escribe tu consulta aquí..." required autocomplete="off">
            <button type="submit">
                <i class="fas fa-paper-plane"></i>
            </button>
        </form>
    </div>

    <script>
        const form = document.getElementById('chat-form');
        const chatBox = document.getElementById('chat-box');
        const input = document.getElementById('user-input');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = input.value;
            
            // Mensaje del usuario
            chatBox.innerHTML += `<div class="message user-msg">${text}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('http://localhost:5000/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ input: text })
                });

                const data = await response.json();
                
                // Mensaje de la IA
                chatBox.innerHTML += `<div class="message ai-msg"><b>IA:</b> ${data.respuesta}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (error) {
                chatBox.innerHTML += `<div class="message ai-msg" style="color:red">Error de conexión.</div>`;
            }
        });
    </script>
</body>
</html>
