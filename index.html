<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat con IA</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        #chat-box { border: 1px solid #ccc; padding: 10px; height: 300px; overflow-y: auto; margin-bottom: 10px; border-radius: 5px; }
        #user-input { width: 80%; padding: 10px; }
        button { padding: 10px; cursor: pointer; }
        .user-msg { color: blue; margin-bottom: 5px; }
        .ai-msg { color: green; margin-bottom: 15px; }
    </style>
</head>
<body>

    <h2>Mi Asistente IA</h2>
    <div id="chat-box"></div>

    <form id="chat-form">
        <input type="text" id="user-input" placeholder="Escribe algo..." required>
        <button type="submit">Enviar</button>
    </form>

    <script>
        const form = document.getElementById('chat-form');
        const chatBox = document.getElementById('chat-box');
        const input = document.getElementById('user-input');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = input.value;
            
            // Mostrar mensaje del usuario en pantalla
            chatBox.innerHTML += `<div class="user-msg"><b>Tú:</b> ${text}</div>`;
            input.value = '';

            try {
                // Petición a tu API de Flask
                const response = await fetch('https://tip-ate-recruitment-alerts.trycloudflare.com/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ input: text })
                });

                const data = await response.json();
                
                // Mostrar respuesta de la IA
                chatBox.innerHTML += `<div class="ai-msg"><b>IA:</b> ${data.respuesta}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (error) {
                chatBox.innerHTML += `<div style="color:red">Error conectando con el servidor</div>`;
            }
        });
    </script>
</body>
</html>
